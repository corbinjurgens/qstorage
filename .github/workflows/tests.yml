name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 7.4
            laravel: 6.*
            testbench: 4.*
            phpunit: 8.*
          - php: 7.4
            laravel: 7.*
            testbench: 5.*
            phpunit: 8.*
          - php: 7.4
            laravel: 8.*
            testbench: 6.*
            phpunit: 9.*
          - php: 8.0
            laravel: 8.*
            testbench: 6.*
            phpunit: 9.*
          - php: 8.1
            laravel: 9.*
            testbench: 7.*
            phpunit: 9.*
          - php: 8.2
            laravel: 10.*
            testbench: 8.*
            phpunit: 10.*
          - php: 8.3
            laravel: 11.*
            testbench: 9.*
            phpunit: 10.*
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            phpunit: 11.*

    name: PHP ${{ matrix.php }} | Laravel ${{ matrix.laravel }}

    env:
      # Composer 2.8.5+ excludes versions with open security advisories from
      # the dependency pool, which prevents installation of older but still
      # supported Laravel releases. CI runs against pinned EOL frameworks on
      # purpose; disabling the audit lets the matrix resolve.
      COMPOSER_AUDIT: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/filesystem:${{ matrix.laravel }}" \
            "illuminate/cache:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-audit

      - name: Run tests
        run: vendor/bin/phpunit
